services:
    app:
        container_name: fullstack_backend
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: ${BUILD_TARGET:-dev}
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - fullstack_net
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        # Подключения к базе и Redis приложение читает из .env, а не из
        # окружения контейнера: иначе они перебили бы .env.testing, и тесты
        # с RefreshDatabase пошли бы в рабочую базу.
        environment:
            - XDEBUG_MODE=${XDEBUG_MODE:-off}
            - PHP_IDE_CONFIG=serverName=fullstack
        ports:
            - '${APP_HOST_PORT:-8000}:8000'

    db:
        container_name: fullstack_db
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
            - ./database/backups:/backups
        ports:
            - '${DB_HOST_PORT:-5440}:5432'
        networks:
            - fullstack_net
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            interval: 5s
            retries: 10
            timeout: 5s

    redis:
        container_name: fullstack_redis
        image: redis:8-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        ports:
            - '${REDIS_HOST_PORT:-6390}:6379'
        networks:
            - fullstack_net
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 10
            timeout: 5s

networks:
    fullstack_net:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
